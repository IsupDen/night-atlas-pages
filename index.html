<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Atlas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06111a;
      --panel: #0d1c27;
      --text: #eef7ff;
      --muted: #9fb0bf;
      --line: #1d3545;
      --accent: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0d2a3c 0, var(--bg) 46rem);
      color: var(--text);
      line-height: 1.55;
    }
    main {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }
    .panel {
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .28);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 8vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }
    p { margin: 0 0 18px; color: var(--muted); font-size: 17px; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }
    a {
      color: var(--text);
      text-decoration: none;
    }
    nav a {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, .04);
    }
    nav a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Night Atlas</h1>
      <p>Arcade geography quiz for iPhone.</p>
      <nav aria-label="Night Atlas pages">
        <a href="privacy.html">Privacy Policy</a>
        <a href="support.html">Support</a>
      </nav>
    </section>
  </main>
</body>
</html>
